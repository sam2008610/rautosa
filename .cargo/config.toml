[build]
# Cortex-M3 (ARMv7-M, no FPU): the CPU of the QEMU `mps2-an385` machine.
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
# `cargo run` boots the ELF in QEMU. Semihosting provides console output and
# lets the firmware terminate QEMU with an exit code.
runner = """
qemu-system-arm \
  -machine mps2-an385 \
  -cpu cortex-m3 \
  -nographic \
  -semihosting-config enable=on,target=native \
  -kernel"""

[alias]
# `cargo clippy --all-targets` would also try to build the test harness for
# the bare-metal target, which has no `std`. Lint the library and the examples.
lint = "clippy --workspace --lib --examples -- -D warnings"
# Unit tests run on the development machine, not on the target.
test-host = "test --workspace --exclude rautosa-examples --target host-tuple --no-fail-fast"
