[workspace]
resolver = "3"
members = ["rautosa-os", "examples"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
# TODO: choose a license (see README) and add `license = "..."` here.
publish = false

[workspace.dependencies]
rautosa-os = { path = "rautosa-os" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
panic-semihosting = { version = "0.7", features = ["exit"] }

[profile.dev]
# Unoptimised Cortex-M code is slow and large; keep debug info, add light optimisation.
opt-level = 1

[profile.release]
debug = true
lto = true
codegen-units = 1
